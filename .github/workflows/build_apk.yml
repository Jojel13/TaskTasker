name: Gerar APK Android

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo do projeto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Instalar dependencias
        run: flutter pub get

      - name: Corrigir compatibilidade do Isar e SDK
        run: |
          # Injeta o namespace exigido pelo Android
          find /home/runner/.pub-cache/ -name "build.gradle" -path "*isar_flutter_libs*" -exec sed -i '/android {/a \    namespace "dev.isar.isar_flutter_libs"' {} + || true

          # Forca o namespace e o SDK 34 em todos os pacotes
          cat << 'EOF' >> android/build.gradle

          subprojects {
              afterEvaluate { project ->
                  if (project.hasProperty('android')) {
                      project.android {
                          if (namespace == null) {
                              namespace project.group ? project.group : "com.fix.${project.name.replaceAll('[^a-zA-Z0-9_]', '_')}"
                          }
                          compileSdkVersion 34
                      }
                  }
              }
          }
          EOF

      - name: Compilar APK Release
        run: flutter build apk --release

      - name: Disponibilizar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
