name: task_tasker
description: "TaskTasker — App de rotinas com temática cyberpunk."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.5.1

  # Database
  isar: ^3.1.0
  isar_flutter_libs: ^3.1.0
  path_provider: ^2.1.3

  # UI & Fonts
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  lottie: ^3.1.0

  # Internacionalização
  intl: ^0.19.0

  # Fase 2
  uuid: ^4.4.0
  flutter_slidable: ^3.1.0
  image_picker: ^1.2.2
  camera: ^0.12.0+1
  flutter_image_compress: ^2.4.0
  clipboard: ^3.0.14
  animated_text_kit: ^4.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  isar_generator: ^3.1.0
  build_runner: ^2.4.9

flutter:
  uses-material-design: true
